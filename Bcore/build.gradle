apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion = "29.0.13846066"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}

// The upstream tree omits its required empty.jar asset. Build a valid DEX
// fallback from source rather than depending on an opaque downloaded binary.
def fallbackClasses = layout.buildDirectory.dir('fallback/classes')
def fallbackDex = layout.buildDirectory.dir('fallback/dex')
def runtimeAssets = layout.buildDirectory.dir('generated/runtime-assets')
tasks.register('compileFallbackStub', JavaCompile) {
    source 'src/guest-stub'
    classpath = files()
    destinationDirectory = fallbackClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('dexFallbackStub', Exec) {
    dependsOn 'compileFallbackStub'
    inputs.dir(fallbackClasses)
    outputs.dir(fallbackDex)
    doFirst {
        fallbackDex.get().asFile.mkdirs()
        commandLine "${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/d8",
                '--min-api', '24', '--output', fallbackDex.get().asFile,
                new File(fallbackClasses.get().asFile, 'com/arnav/runtime/Empty.class')
    }
}
tasks.register('packFallbackDex', Zip) {
    dependsOn 'dexFallbackStub'
    from(fallbackDex) { include 'classes.dex' }
    archiveFileName = 'empty.jar'
    destinationDirectory = runtimeAssets
}
android.sourceSets.main.assets.srcDir(runtimeAssets)
tasks.named('preBuild').configure { dependsOn 'packFallbackDex' }


tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
  implementation 'com.google.android.material:material:1.3.0'
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'



    
}
