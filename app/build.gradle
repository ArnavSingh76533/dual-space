plugins { id 'com.android.application' }
android {
    namespace 'com.arnav.nimbus'
    compileSdk 35
    ndkVersion '29.0.13846066'
    defaultConfig {
        applicationId 'com.arnav.nimbus'
        minSdk 24
        // The virtualization engine relies on legacy APIs. See docs/COMPATIBILITY.md.
        targetSdk 28
        versionCode 4
        versionName '1.1.0'
        buildConfigField 'boolean', 'HAS_STABLE_SIGNING', System.getenv('NIMBUS_KEYSTORE_PATH') ? 'true' : 'false'
    }
    signingConfigs {
        if (System.getenv('NIMBUS_KEYSTORE_PATH')) {
            stable {
                storeFile file(System.getenv('NIMBUS_KEYSTORE_PATH'))
                storePassword System.getenv('NIMBUS_STORE_PASSWORD')
                keyAlias System.getenv('NIMBUS_KEY_ALIAS')
                keyPassword System.getenv('NIMBUS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (System.getenv('NIMBUS_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'SetTextI18n', 'HardcodedText' }
}
dependencies {
    implementation project(':Bcore')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
