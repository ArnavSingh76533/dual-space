name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.13846066'
      - name: Load optional stable signing key
        env:
          NIMBUS_KEYSTORE_BASE64: ${{ secrets.NIMBUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NIMBUS_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$NIMBUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nimbus-signing.jks"
            echo "NIMBUS_KEYSTORE_PATH=$RUNNER_TEMP/nimbus-signing.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and test
        env:
          NIMBUS_STORE_PASSWORD: ${{ secrets.NIMBUS_STORE_PASSWORD }}
          NIMBUS_KEY_ALIAS: ${{ secrets.NIMBUS_KEY_ALIAS }}
          NIMBUS_KEY_PASSWORD: ${{ secrets.NIMBUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/Nimbus-arm64.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist/Nimbus-arm32.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-APK
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            Bcore/build/reports/
          if-no-files-found: ignore
